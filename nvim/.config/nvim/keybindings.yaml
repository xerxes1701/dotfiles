  # ------------------------------------------------------------------ #
  # hydra.nvim (treewalker hydra) - lua/config/hydra-codenav.lua        #
  # `S` is the body: a real normal-mode mapping that enters the pink    #
  # hydra "treewalker". Every following entry is a *head* of that       #
  # hydra - mode `hydra(treewalker)`, live only while the hydra is up.  #
  # Pink means it stays up after a head runs, so heads repeat: `S m m`  #
  # walks forward two functions. It never times out (timeout = false).  #
  # ------------------------------------------------------------------ #
  - { key: "S",  mode: ["n"],                 action: "enter hydra",                            description: 'Enter the pink hydra "treewalker" (also unbinds the default S)', file: "lua/config/hydra-codenav.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit", hydra: { name: "treewalker", color: "pink" } }
  - { key: "k",  mode: ["hydra(treewalker)"], action: "<cmd>Treewalker Up<cr>",                 description: "Move up a sibling node",                                         file: "lua/config/hydra-codenav.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
