# ==================================================================== #
# Neovim BUILT-IN defaults (source: builtin)                           #
#                                                                      #
# Core editor commands Neovim ships with (motions, operators, text     #
# objects, etc.). These are NOT set via vim.keymap.set and never show  #
# up in :map / nvim_get_keymap. Entries whose (key,mode) is globally    #
# remapped by this config are intentionally omitted.                   #
# ==================================================================== #
builtin_bindings:
  # ------------------------------------------------------------------ #
  # Motion                                                             #
  # ------------------------------------------------------------------ #
  - { key: "h"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Left one character"                           , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "l"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Right one character"                          , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "0"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To first column of line"                      , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "^"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To first non-blank character of line"         , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "$"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To end of line"                               , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "g_"       , mode: ["n", "x", "o"], action: "(motion)"  , description: "To last non-blank character of line"          , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "|"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To column [count]"                            , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "f{char}"  , mode: ["n", "x", "o"], action: "(motion)"  , description: "To next occurrence of {char}"                 , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "F{char}"  , mode: ["n", "x", "o"], action: "(motion)"  , description: "To previous occurrence of {char}"             , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "t{char}"  , mode: ["n", "x", "o"], action: "(motion)"  , description: "Till before next {char}"                      , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "T{char}"  , mode: ["n", "x", "o"], action: "(motion)"  , description: "Till after previous {char}"                   , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: ";"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Repeat last f/F/t/T"                          , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: ","        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Repeat last f/F/t/T reversed"                 , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "j"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Down one line"                                , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "k"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Up one line"                                  , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "+"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Down to first non-blank of next line"         , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "G"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To last line (or line [count])"               , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "gg"       , mode: ["n", "x", "o"], action: "(motion)"  , description: "To first line (or line [count])"              , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "H"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To top of window"                             , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "M"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To middle of window"                          , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "L"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To bottom of window"                          , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "w"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward to start of next word"                , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "W"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward to start of next WORD"                , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "e"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward to end of word"                       , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "E"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward to end of WORD"                       , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "b"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Back to start of word"                        , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "B"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Back to start of WORD"                        , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "ge"       , mode: ["n", "x", "o"], action: "(motion)"  , description: "Back to end of previous word"                 , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "gE"       , mode: ["n", "x", "o"], action: "(motion)"  , description: "Back to end of previous WORD"                 , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "{"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Backward one paragraph"                       , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "}"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward one paragraph"                        , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "("        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Backward one sentence"                        , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: ")"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward one sentence"                         , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "%"        , mode: ["n", "x", "o"], action: "(motion)"  , description: "To matching bracket/pair"                     , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "[["       , mode: ["n", "x", "o"], action: "(motion)"  , description: "Backward to section/'{' in column 1"          , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  - { key: "]]"       , mode: ["n", "x", "o"], action: "(motion)"  , description: "Forward to section/'{' in column 1"           , file: "", plugin: "", group: "Motion"            , source: "builtin" }
  # ------------------------------------------------------------------ #
  # Search                                                             #
  # ------------------------------------------------------------------ #
  - { key: "/"        , mode: ["n", "x", "o"], action: "(search)"  , description: "Search forward"                               , file: "", plugin: "", group: "Search"            , source: "builtin" }
  - { key: "?"        , mode: ["n", "x", "o"], action: "(search)"  , description: "Search backward"                              , file: "", plugin: "", group: "Search"            , source: "builtin" }
  - { key: "n"        , mode: ["n", "x", "o"], action: "(search)"  , description: "Repeat last search"                           , file: "", plugin: "", group: "Search"            , source: "builtin" }
