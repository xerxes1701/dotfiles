# What zsh, nushell and PowerShell run `starship module git_status` with just
# before each prompt, handing the result to starship.toml in
# $STARSHIP_GIT_STATUS (see its header): the git band's counters, a coloured
# sign and count per kind of change and arrows for commits to push and to
# pull, on the band's colour. Found next to starship.toml, wherever
# STARSHIP_CONFIG puts that.
#
# fish runs the same in the background, from the copy
# fish/.config/fish/conf.d/starship-async-git.fish writes, and the status line
# from claude/.claude/status-band/git-status.toml; keep the three in step.

palette = 'one_half_dark'

[git_status]
format = '$conflicted$staged$renamed$modified$deleted$typechanged$untracked$stashed$ahead_behind'
conflicted = '[ =${count}](bg:surface fg:orange)'
staged = '[ +${count}](bg:surface fg:green)'
renamed = '[ »${count}](bg:surface fg:purple)'
modified = '[ ~${count}](bg:surface fg:yellow)'
deleted = '[ -${count}](bg:surface fg:red)'
typechanged = '[ t${count}](bg:surface fg:purple)'
untracked = '[ ?${count}](bg:surface fg:subtext)'
stashed = '[ ≡${count}](bg:surface fg:blue)'
ahead = '[ 󱦲${count}](bg:surface fg:cyan)'
behind = '[ 󱦳${count}](bg:surface fg:cyan)'
diverged = '[ 󱦲${ahead_count}](bg:surface fg:cyan)[ 󱦳${behind_count}](bg:surface fg:cyan)'
up_to_date = ''

[palettes.one_half_dark]
surface = '#3E4451'
subtext = '#AFB3BB'
red = '#D5A7AB'
orange = '#C9AE93'
yellow = '#D7C198'
green = '#A1BA8E'
cyan = '#8CBBC1'
blue = '#8FB7D7'
purple = '#C9A7D3'
