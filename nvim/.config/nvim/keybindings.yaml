# keybindings.yaml
#
# Inventory of Neovim keybindings for this configuration.
#
# Three kinds of entries are tracked, each in its own top-level list:
#   * keybindings       (source: explicit) -> the mapping is defined somewhere
#                          in a *.lua file of this config. `file` points at the
#                          relative path and `plugin` (when set) names the
#                          plugin that file configures.
#   * default_bindings  (source: default)  -> the mapping is set implicitly by
#                          the plugin itself (its built-in / out-of-the-box
#                          default). `file` is empty because the user never
#                          wrote it down; `plugin` names the owning plugin.
#   * builtin_bindings  (source: builtin)  -> a Neovim core default (motions,
#                          operators, text objects, ...). These are NOT set via
#                          vim.keymap.set and never appear in `:map` /
#                          `nvim_get_keymap`. `file` and `plugin` are empty.
#                          Keys this config globally remaps are omitted.
#
# Every entry is one binding - never pack a forward/backward pair into a single
# node. `key` holds exactly the keys you press in the mode(s) listed, with no
# invented prefix.
#
# `mode` is a LIST. Besides the Vim modes (n i c v x o t) it may hold the
# pseudo-mode `hydra(<name>)`, meaning: this key is a *head* of the hydra called
# <name> and is live only while that hydra is open. A head is therefore written
# bare (`i`), not as a chord off the body key (`<leader>ld i`) - the body is a
# separate entry of its own.
#
# A hydra body entry carries an extra `hydra: { name, color }` field naming the
# hydra it opens and that hydra's color. `red`/`pink` hydras stay open after a
# head runs, so heads repeat: `<leader>ld i i` walks two infos forward.
#
# The companion script `keybindings-to-md.cs` turns this file into
# `keybindings.md` with four different groupings.

meta:
  leader: "<Space>"
  localleader: "\\"
  config_root: ".config/nvim"

keybindings:
  # ------------------------------------------------------------------ #
  # core config - lua/keymaps.lua  (no plugin)                         #
  # ------------------------------------------------------------------ #
  - { key: "J",            mode: ["x"],           action: ":move '>+1<CR>gv=gv",              description: "Move selected block down",                file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "K",            mode: ["x"],           action: ":move '<-2<CR>gv=gv",              description: "Move selected block up",                  file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<ESC>",        mode: ["n"],           action: ":nohlsearch|:echo<CR>",            description: "Clear search highlight",                  file: "lua/keymaps.lua", plugin: "", group: "Search",          source: "explicit" }
  - { key: "<leader>y",    mode: ["n"],           action: '"+y',                              description: "Yank to system clipboard",                file: "lua/keymaps.lua", plugin: "", group: "Clipboard",       source: "explicit" }
  - { key: "<leader>y",    mode: ["v"],           action: '"+y',                              description: "Yank selection to system clipboard",      file: "lua/keymaps.lua", plugin: "", group: "Clipboard",       source: "explicit" }
  - { key: "<leader>p",    mode: ["n"],           action: '"+p',                              description: "Paste from system clipboard",             file: "lua/keymaps.lua", plugin: "", group: "Clipboard",       source: "explicit" }
  - { key: "<leader>p",    mode: ["v"],           action: '"_dP',                             description: "Paste over selection without yanking",    file: "lua/keymaps.lua", plugin: "", group: "Clipboard",       source: "explicit" }
  - { key: "d",            mode: ["n"],           action: '"_d',                              description: "Delete into black-hole register",         file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "c",            mode: ["n"],           action: '"_c',                              description: "Change into black-hole register",         file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<leader>d",    mode: ["n"],           action: "d",                                description: "Delete (yank into default register)",     file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<leader>c",    mode: ["n"],           action: "c",                                description: "Change (yank into default register)",     file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<leader>+",    mode: ["n"],           action: "<C-a>",                            description: "Increment number under cursor",           file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<leader>-",    mode: ["n"],           action: "<C-x>",                            description: "Decrement number under cursor",           file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "x",            mode: ["n"],           action: '"_x',                              description: "Delete char without yanking",             file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "Q",            mode: ["n"],           action: "<nop>",                            description: "Disable Ex mode",                         file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<",            mode: ["v"],           action: "<gv",                              description: "Indent left, keep selection",             file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: ">",            mode: ["v"],           action: ">gv",                              description: "Indent right, keep selection",            file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<",            mode: ["n"],           action: "<<",                               description: "Indent line left",                        file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: ">",            mode: ["n"],           action: ">>",                               description: "Indent line right",                       file: "lua/keymaps.lua", plugin: "", group: "Editing",         source: "explicit" }
  - { key: "<leader>L",    mode: ["n"],           action: "<cmd>Lazy<CR>",                    description: "Open Lazy plugin manager",                file: "lua/keymaps.lua", plugin: "", group: "Misc",            source: "explicit" }
  - { key: "<leader>sv",   mode: ["n"],           action: "<cmd>vsplit<CR>",                  description: "Split window vertically",                  file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<leader>sh",   mode: ["n"],           action: "<cmd>split<CR>",                   description: "Split window horizontally",                file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<leader>se",   mode: ["n"],           action: "<C-w>=",                           description: "Equalize split sizes",                    file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<leader>sq",   mode: ["n"],           action: "<cmd>close<CR>",                   description: "Close current split",                     file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<C-Left>",     mode: ["n"],           action: ":vertical resize +1<CR>",          description: "Increase vertical split width",           file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<C-Right>",    mode: ["n"],           action: ":vertical resize -1<CR>",          description: "Decrease vertical split width",           file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<C-Up>",       mode: ["n"],           action: ":resize +1<CR>",                   description: "Increase split height",                   file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<C-Down>",     mode: ["n"],           action: ":resize -1<CR>",                   description: "Decrease split height",                   file: "lua/keymaps.lua", plugin: "", group: "Windows",         source: "explicit" }
  - { key: "<leader>to",   mode: ["n"],           action: "<cmd>tabnew<CR>",                  description: "Open new tab",                            file: "lua/keymaps.lua", plugin: "", group: "Tabs",            source: "explicit" }
  - { key: "<leader>tf",   mode: ["n"],           action: "<cmd>tabnew %<CR>",                description: "Open current file in new tab",            file: "lua/keymaps.lua", plugin: "", group: "Tabs",            source: "explicit" }
  - { key: "<leader>tq",   mode: ["n"],           action: "<cmd>tabclose<CR>",                description: "Close current tab",                       file: "lua/keymaps.lua", plugin: "", group: "Tabs",            source: "explicit" }
  - { key: "<leader>tn",   mode: ["n"],           action: "<cmd>tabn<CR>",                    description: "Go to next tab",                          file: "lua/keymaps.lua", plugin: "", group: "Tabs",            source: "explicit" }
  - { key: "<leader>tp",   mode: ["n"],           action: "<cmd>tabp<CR>",                    description: "Go to previous tab",                      file: "lua/keymaps.lua", plugin: "", group: "Tabs",            source: "explicit" }
  - { key: "<leader><Tab>", mode: ["n"],           action: "<cmd>tabn<CR>",                    description: "Go to next tab",                          file: "lua/keymaps.lua", plugin: "", group: "Tabs",            source: "explicit" }
