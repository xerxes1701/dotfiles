  # ------------------------------------------------------------------ #
  # hydra.nvim (treewalker hydra) - lua/plugins/hydra.lua              #
  # `s` opens a persistent "pink" hydra; the remaining keys are heads  #
  # active only while the hydra is open.                               #
  # ------------------------------------------------------------------ #
  - { key: "s",            mode: "n",     action: "activate treewalker hydra",        description: "Open treewalker hydra (also disables default s)", file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
  - { key: "s k",          mode: "n",     action: "<cmd>Treewalker Up<cr>",           description: "Treewalker: move up",                     file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
  - { key: "s l",          mode: "n",     action: "<cmd>Treewalker Right<cr>",        description: "Treewalker: move right",                  file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
  - { key: "s j",          mode: "n",     action: "<cmd>Treewalker Down<cr>",         description: "Treewalker: move down",                   file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
  - { key: "s h",          mode: "n",     action: "<cmd>Treewalker Left<cr>",         description: "Treewalker: move left",                   file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
  - { key: "s ==",         mode: "n",     action: "goto_next_start @assignment.outer", description: "Hydra: next assignment",                 file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
