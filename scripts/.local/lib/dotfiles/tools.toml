# The tools this repository needs, and how to install each one. Read by
# install-tools.sh, which explains how it picks a way and orders the needs.
#
# One [table] per tool, named after the stow package its config lives in, or
# for a tool a package needs rather than configures, after the tool:
#
#   desc         what it is, and what here uses it
#   os           where it should be installed: linux, windows, or a single
#                distribution, arch or debian, e.g. ["linux", "windows"]
#
# The ways it can be installed, any number of them:
#
#   pacman       cachyos/arch packages
#   apt          ubuntu/debian packages
#   winget       winget ids, installed with --exact
#   paru         aur packages, on arch
#   cargo        crates, installed with cargo install --locked
#   npm          npm packages, installed with npm install -g
#   flatpak      flathub app ids, on linux
#   script       a bash script that installs it, run with set -euo pipefail
#
# The platform's manager -- pacman, apt or winget -- is tried first, and only
# when it has every package listed: ubuntu's release decides what it has, and
# cachyos's repositories have what arch's need the aur for. Then the others,
# in the order the tool lists them. paru, cargo, npm and flatpak need the tool
# that provides their command (see provides), and install-tools.sh proposes
# to install that one first.
#
# And what else it takes:
#
#   needs        tools to install before this one
#   provides     the commands it brings that a way above runs, when they are
#                not named after the tool: rust provides cargo
#   check        a command that succeeds when the tool is there. Without one,
#                the manager of the way picked is asked, and for a script,
#                whether a command named after the tool is on PATH
#   setup        a script to run after its packages, whether they were
#                installed now or before: rustup installs no toolchain
#   setup_check  a command that succeeds when the setup is done. Without one,
#                the setup runs every time, so it must be safe to
#                repeat
#   note         what to do by hand where none of the ways works
#
# Packages are a "string" or an [array] of them; a script, check or setup is
# a string, or a '''multi-line string''' for more than one line. Scripts run
# in this file's directory with bash, with as_root (sudo unless root),
# link_needed and link_apply in scope, and $os, $distro and $manager set.
#
# Any key but desc and os can be narrowed to one platform with a suffix:
# .linux or .windows, or the distribution, .arch or .debian; the narrowest
# that matches wins. script.linux is a script for linux only, needs.debian
# what only ubuntu needs, and an empty string switches a way off there.
#
# Only what the reader in install-tools.sh handles goes here: bare table
# names and keys, strings without escapes other than \" \\ \n \t, arrays of
# strings, comments. It says which line it cannot read.
#
# Not every package is a tool: gtk-3.0, images and xkb are plain config,
# tmux-powerline is a tmux plugin that tpm installs, and scoop installs itself
# from a script, so none of them is listed.
#
# ubuntu's archive was checked for 24.04 (noble): fastfetch and starship arrive
# in 25.04, ghostty in 26.04.

# --- what the others need first ---------------------------------------------

[paru]
desc = "aur helper, for the aur packages below"
os = ["arch"]
# cachyos has it in its own repository; arch builds it from the aur, which
# makepkg refuses to do as root.
pacman = "paru"
script.arch = '''
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git clone --depth 1 https://aur.archlinux.org/paru-bin.git "$tmp/paru-bin"
cd "$tmp/paru-bin"
makepkg -si --noconfirm
'''
needs.arch = ["git", "base-devel"]

[base-devel]
desc = "compilers and make: builds paru and what cargo installs"
os = ["linux"]
pacman = "base-devel"
apt = "build-essential"

[curl]
desc = "downloads, for the install scripts here"
os = ["linux"]
pacman = "curl"
apt = "curl"

[flatpak]
desc = "flatpak, with flathub: apps the distribution does not package"
os = ["linux"]
pacman = "flatpak"
apt = "flatpak"
setup_check = "flatpak remotes --columns=name | grep -qx flathub"
setup = "as_root flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"

# --- languages and their package managers ------------------------------------

# rustup installs no toolchain itself, and puts a rust-analyzer proxy on PATH
# whether the component is there or not. rustaceanvim and nvim's verify.sh,
# which has no mason, run that proxy, and it fails without the component.
# winget's and the script's rustup land in ~/.cargo/bin, which install-tools.sh
# puts on PATH for the tools after it.
[rust]
desc = "rust toolchain manager: cargo, for rustaceanvim"
os = ["linux", "windows"]
provides = ["cargo", "rustup"]
pacman = "rustup"
apt = "rustup"
winget = "Rustlang.Rustup"
script.linux = '''
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
    | sh -s -- -y --no-modify-path --default-toolchain none
'''
needs.linux = ["base-devel"]
needs.debian = ["curl", "base-devel"]
check = "command -v rustup"
setup_check = '''
rustup show active-toolchain && rustup component list --installed | grep -q '^rust-analyzer'
'''
setup = '''
rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
rustup component add rust-analyzer
'''

