  # ------------------------------------------------------------------ #
  # hydra.nvim (diagnostics hydra) - lua/config/hydra-diagnostics.lua   #
  # `<leader>ld` is the body: a real normal-mode mapping that enters    #
  # the red hydra "diagnostics". Every following entry is a *head* of   #
  # that hydra - mode `hydra(diagnostics)`, live only while it is up.   #
  # Red means it stays up after a head runs, so heads repeat:           #
  # `<leader>ld i i` jumps to the second-next info. Scope and severity  #
  # filter are remembered across invocations.                          #
  # ------------------------------------------------------------------ #
  - { key: "<leader>ld", mode: ["n"],                  action: "enter hydra",                                      description: 'Enter the red hydra "diagnostics"', file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit", hydra: { name: "diagnostics", color: "red" } }
  - { key: "d",          mode: ["hydra(diagnostics)"], action: "goto next diagnostic",                             description: "Next diagnostic",                   file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "D",          mode: ["hydra(diagnostics)"], action: "goto previous diagnostic",                         description: "Previous diagnostic",               file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "}",          mode: ["hydra(diagnostics)"], action: "goto last diagnostic",                             description: "Last diagnostic",                   file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "{",          mode: ["hydra(diagnostics)"], action: "goto first diagnostic",                            description: "First diagnostic",                  file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "e",          mode: ["hydra(diagnostics)"], action: "goto next ERROR diagnostic",                       description: "Next error",                        file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "E",          mode: ["hydra(diagnostics)"], action: "goto previous ERROR diagnostic",                   description: "Previous error",                    file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "w",          mode: ["hydra(diagnostics)"], action: "goto next WARN diagnostic",                        description: "Next warning",                      file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "W",          mode: ["hydra(diagnostics)"], action: "goto previous WARN diagnostic",                    description: "Previous warning",                  file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "i",          mode: ["hydra(diagnostics)"], action: "goto next INFO diagnostic",                        description: "Next info",                         file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "I",          mode: ["hydra(diagnostics)"], action: "goto previous INFO diagnostic",                    description: "Previous info",                     file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "h",          mode: ["hydra(diagnostics)"], action: "goto next HINT diagnostic",                        description: "Next hint",                         file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "H",          mode: ["hydra(diagnostics)"], action: "goto previous HINT diagnostic",                    description: "Previous hint",                     file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "b",          mode: ["hydra(diagnostics)"], action: "toggle scope buffer/project",                      description: "Toggle scope (buffer/project)",     file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "x",          mode: ["hydra(diagnostics)"], action: "<cmd>Trouble diagnostics toggle<cr>",              description: "Trouble diagnostics (workspace)",   file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "X",          mode: ["hydra(diagnostics)"], action: "<cmd>Trouble diagnostics toggle filter.buf=0<cr>", description: "Trouble diagnostics (buffer)",      file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "tv",         mode: ["hydra(diagnostics)"], action: "toggle diagnostic virtual_lines",                  description: "Toggle virtual_lines",              file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "tc",         mode: ["hydra(diagnostics)"], action: "toggle codelens_enabled",                          description: "Toggle CodeLenses",                 file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "ti",         mode: ["hydra(diagnostics)"], action: "toggle inlay hints",                               description: "Toggle inlay hints",                file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "q",          mode: ["hydra(diagnostics)"], action: "exit hydra",                                       description: "Leave the hydra",                   file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }
  - { key: "<Esc>",      mode: ["hydra(diagnostics)"], action: "exit hydra",                                       description: "Leave the hydra",                   file: "lua/config/hydra-diagnostics.lua", plugin: "hydra.nvim", group: "Diagnostics Hydra", source: "explicit" }

