# al aliases for git -- the format: `al help alias`
# One word per (sub-)command. Options are typed out: g c --amend, g ph --force-with-lease.

# files
a = "add"
s = "status"
d = "diff"
rt = "restore"
rs = "reset"
cn = "clean"
gr = "grep"
bl = "blame"

# commits
c = "commit"
l = "log"
sho = "show"
rl = "reflog"
t = "tag"
rv = "revert"
cp = "cherry-pick"

# branches
b = "branch"
sh = "switch"
co = "checkout"
m = "merge"
rb = "rebase"
mb = "merge-base"
bi = "bisect"

# remotes
cl = "clone"
f = "fetch"
pl = "pull"
ph = "push"
r = "remote"

# commands of our own (shell aliases below)
del = "delete"

# everything else
st = "stash"
