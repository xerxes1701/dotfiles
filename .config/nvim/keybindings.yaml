  - { key: "<leader>f?",   mode: "n",     action: "<cmd>Telescope help_tags<cr>",     description: "Fuzzy find: help tags",                   file: "lua/plugins/telescope.lua", plugin: "telescope.nvim", group: "Fuzzy Find", source: "explicit" }
  - { key: "<leader>fk",   mode: "n",     action: "<cmd>Telescope keymaps<cr>",       description: "Fuzzy find: keymaps",                     file: "lua/plugins/telescope.lua", plugin: "telescope.nvim", group: "Fuzzy Find", source: "explicit" }
  - { key: "<leader>fK",   mode: "n",     action: "<cmd>lua require('keymap_registry').pick()<cr>", description: "Fuzzy find: keymaps by plugin", file: "lua/plugins/telescope.lua", plugin: "telescope.nvim", group: "Fuzzy Find", source: "explicit" }
  - { key: "<leader>ft",   mode: "n",     action: "<cmd>TodoTelescope<CR>",           description: "Fuzzy find: TODO comments",               file: "lua/plugins/telescope.lua", plugin: "telescope.nvim", group: "Fuzzy Find", source: "explicit" }
