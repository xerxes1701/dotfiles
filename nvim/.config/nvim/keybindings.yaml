# ==================================================================== #
# default_bindings                                                     #
#                                                                      #
# Implicit keymaps that plugins register out-of-the-box (the user      #
# never wrote these down). They are marked `source: default` and carry #
# no `file`. Only plugins that actually ship default maps are listed;  #
# plugins with NO defaults (harpoon, gitsigns, treewalker, which-key,  #
# bufferline, auto-session, nvim-treesitter-textobjects) are omitted.  #
# ==================================================================== #
default_bindings:
  - { key: "ys{motion}{char}", mode: ["n"],           action: "add surround around motion",          description: "Surround: add pair around a motion",          file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "yss",   mode: ["n"],           action: "add surround around line",                     description: "Surround: add pair around current line",      file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "yS",    mode: ["n"],           action: "add surround around motion (new lines)",       description: "Surround: add pair around motion, on new lines", file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "ySS",   mode: ["n"],           action: "add surround around line (new lines)",         description: "Surround: add pair around line, on new lines", file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "ds{char}", mode: ["n"],           action: "delete surround",                             description: "Surround: delete a surrounding pair",         file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "cs{target}{replacement}", mode: ["n"],           action: "change surround",              description: "Surround: change a surrounding pair",         file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "cS",    mode: ["n"],           action: "change surround (new lines)",                  description: "Surround: change a pair onto new lines",      file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "S",     mode: ["x"],           action: "surround selection",                           description: "Surround: add pair around visual selection",  file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "gS",    mode: ["x"],           action: "surround selection (new lines)",               description: "Surround: add pair around selection, on new lines", file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "<C-g>s", mode: ["i"],           action: "surround at cursor",                           description: "Surround: add pair around the cursor",        file: "", plugin: "nvim-surround", group: "Surround", source: "default" }
  - { key: "<C-g>S", mode: ["i"],           action: "surround at cursor (new lines)",               description: "Surround: add pair around cursor, on new lines", file: "", plugin: "nvim-surround", group: "Surround", source: "default" }

