  # ---- nvim-origami (global; overrides h/l/^/$) ---- #
  - { key: "h",      mode: "n",  action: "fold or normal h",                             description: "Origami: fold when at/before first non-blank, else h", file: "", plugin: "nvim-origami", group: "Folding", source: "default" }
  - { key: "l",      mode: "n",  action: "unfold or normal l",                           description: "Origami: unfold folded line, else l",         file: "", plugin: "nvim-origami", group: "Folding", source: "default" }
  - { key: "^",      mode: "n",  action: "fold recursively or normal ^",                 description: "Origami: fold recursively when before first non-blank, else ^", file: "", plugin: "nvim-origami", group: "Folding", source: "default" }
  - { key: "$",      mode: "n",  action: "unfold recursively or normal $",               description: "Origami: unfold recursively on folded line, else $", file: "", plugin: "nvim-origami", group: "Folding", source: "default" }

  # ---- diffview.nvim (diffview tab pages; representative default mappings) ---- #
  - { key: "<Tab>",     mode: "n", action: "next file diff",                             description: "Diffview: open diff for next file",           file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "<S-Tab>",   mode: "n", action: "previous file diff",                         description: "Diffview: open diff for previous file",       file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "gf",        mode: "n", action: "goto_file",                                  description: "Diffview: open local file in a tabpage",      file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "<leader>b", mode: "n", action: "toggle file panel",                          description: "Diffview: toggle the file panel",             file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "<leader>e", mode: "n", action: "focus file panel",                           description: "Diffview: focus the file panel",              file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "-",         mode: "n", action: "stage/unstage entry (file panel)",           description: "Diffview file panel: stage/unstage entry",    file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "S",         mode: "n", action: "stage all (file panel)",                     description: "Diffview file panel: stage all entries",      file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "U",         mode: "n", action: "unstage all (file panel)",                   description: "Diffview file panel: unstage all entries",    file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "X",         mode: "n", action: "restore entry (file panel)",                 description: "Diffview file panel: revert file to left state", file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "<leader>co", mode: "n", action: "conflict: choose ours",                     description: "Diffview merge: choose OURS",                 file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "<leader>ct", mode: "n", action: "conflict: choose theirs",                   description: "Diffview merge: choose THEIRS",               file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "<leader>cb", mode: "n", action: "conflict: choose base",                     description: "Diffview merge: choose BASE",                 file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "]x",        mode: "n", action: "next conflict",                              description: "Diffview merge: jump to next conflict",       file: "", plugin: "diffview.nvim", group: "Git", source: "default" }
  - { key: "[x",        mode: "n", action: "previous conflict",                          description: "Diffview merge: jump to previous conflict",   file: "", plugin: "diffview.nvim", group: "Git", source: "default" }

  # ---- trouble.nvim (Trouble window-local; representative default mappings) ---- #
  - { key: "?",      mode: "n",  action: "help",                                         description: "Trouble window: show help",                   file: "", plugin: "trouble.nvim", group: "Diagnostics", source: "default" }
  - { key: "r",      mode: "n",  action: "refresh",                                      description: "Trouble window: refresh",                     file: "", plugin: "trouble.nvim", group: "Diagnostics", source: "default" }
  - { key: "q",      mode: "n",  action: "close",                                        description: "Trouble window: close",                       file: "", plugin: "trouble.nvim", group: "Diagnostics", source: "default" }
  - { key: "o",      mode: "n",  action: "jump + close",                                 description: "Trouble window: jump to item and close",      file: "", plugin: "trouble.nvim", group: "Diagnostics", source: "default" }
  - { key: "<CR>",   mode: "n",  action: "jump",                                         description: "Trouble window: jump to item",                file: "", plugin: "trouble.nvim", group: "Diagnostics", source: "default" }
  - { key: "<C-s>",  mode: "n",  action: "jump (horizontal split)",                      description: "Trouble window: jump in horizontal split",    file: "", plugin: "trouble.nvim", group: "Diagnostics", source: "default" }
