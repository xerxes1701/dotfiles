# One powerline strip of chevrons in muted colours, like Claude Code's status
# line (claude/.claude/status-band): rounded at the start, coloured bands
# first, then the dark greys, fading out into the background. User and host
# (over SSH only) on red, the directory on blue, git on `surface`, and the
# shell, the toolchains and the last command's duration on `deep`, with the
# prompt character on the line below, green or red by the last command's exit
# status.
# All text is tinted like its band and has a contrast of at least 4.6 against
# it.
#
# The two dark bands are always drawn, if only as their arrow, so every arrow
# joins two known colours whatever shows. Only the directory's start depends
# on what came before: its cap takes prev_bg as background, which is the
# terminal's at the start of the line, and blue after the arrow that ends user
# and host, where the cap reads as part of the band.
# $all places every module the format doesn't name after the strip, in
# starship's default style, so nothing starship would show is lost and none of
# it lands inside a band.
#
# git_status runs `git status`, which takes seconds in a large repo and far
# longer on /mnt/c, so it never runs in the prompt. fish renders it in the
# background (see conf.d/starship-async-git.fish); the shells that have no
# background job -- bash, and zsh, nushell and PowerShell in ~/dotfiles --
# render it just before the prompt, with starship-git-status.toml. Either way
# the result is handed over in $STARSHIP_GIT_STATUS, shown here in
# git_status's place inside the git band. That run draws the counters, a
# coloured sign and count per kind of change and arrows for commits to push
# and to pull. env_var adds no style: the counters end in a reset, and starship
# sets the band's colour again for its last space only if the style before it
# was a different one.

palette = 'one_half_dark'

format = """
([](fg:red_band)$username$hostname[ ](bg:red_band)[](fg:red_band bg:blue_band))\
[](fg:blue_band bg:prev_bg)$directory[ ](bg:blue_band)\
[](fg:blue_band bg:surface)($git_branch$git_commit$git_state$git_metrics${env_var.STARSHIP_GIT_STATUS}[ ](bg:surface))\
[](fg:surface bg:deep)($shell$package$c$docker_context$dotnet$golang$lua$nodejs$python$rust$typst$cmd_duration[ ](bg:deep))\
[](fg:deep)( $all)\
$line_break\
$jobs$character"""

[git_status]
disabled = true

[env_var.STARSHIP_GIT_STATUS]
format = '$env_value'   # empty when clean, hidden when unset

[username]
format = '[  $user]($style)'
style_user = 'bg:red_band fg:red_band_text'
style_root = 'bg:red_band fg:red_band_text bold'

[hostname]
format = '[@$hostname]($style)'
style = 'bg:red_band fg:red_band_text'

[directory]
format = '[ 󰉋 $path]($style)[$read_only]($read_only_style)'
style = 'bg:blue_band fg:blue_band_text'
read_only = ' 󰌾'
read_only_style = 'bg:blue_band fg:blue_band_text'

[git_branch]
symbol = ''
format = '[ $symbol $branch(:$remote_branch)]($style)'
style = 'bg:surface fg:purple'

# The short commit hash after the branch name, attached or not; nothing in a
# repository without commits.
[git_commit]
commit_hash_length = 7
only_detached = false
format = '([  $hash$tag]($style))'
tag_symbol = '  '
style = 'bg:surface fg:yellow'

[git_state]
format = '[ $state( $progress_current/$progress_total)]($style)'
style = 'bg:surface fg:orange bold'

[git_metrics]
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'
added_style = 'bg:surface fg:green'
deleted_style = 'bg:surface fg:red'

[cmd_duration]
format = '[ 󰔛 $duration]($style)'
style = 'bg:deep fg:yellow'

[jobs]
format = '[$symbol( $number)]($style) '
symbol = ''
style = 'blue'

[character]
success_symbol = '[❯](bold success)'
error_symbol = '[❯](bold error)'

# The shell this prompt is drawn for, first on the darkest band: the same
# starship.toml serves fish, zsh, nushell and PowerShell.
[shell]
disabled = false
format = '[  $indicator]($style)'
fish_indicator = 'fish'
zsh_indicator = 'zsh'
bash_indicator = 'bash'
nu_indicator = 'nu'
powershell_indicator = 'powershell'
pwsh_indicator = 'pwsh'
cmd_indicator = 'cmd'
unknown_indicator = 'yazi'   # starship.yazi runs starship with no shell
style = 'bg:deep fg:subtext'

# The toolchains, each tinted in its own colour on the darkest band. A
# language without a table here still shows, after the strip.

[package]
symbol = '󰏗'
format = '[ $symbol $version]($style)'
style = 'bg:deep fg:subtext'

[c]
symbol = ''
format = '[ $symbol( $version)]($style)'
style = 'bg:deep fg:blue'

[docker_context]
symbol = ''
format = '[ $symbol $context]($style)'
style = 'bg:deep fg:blue'

[dotnet]
symbol = '󰪮'
format = '[ $symbol( $version)( 󰓾 $tfm)]($style)'
style = 'bg:deep fg:cyan'

[golang]
symbol = ''
format = '[ $symbol( $version)]($style)'
style = 'bg:deep fg:cyan'

[lua]
symbol = ''
format = '[ $symbol( $version)]($style)'
style = 'bg:deep fg:blue'

[nodejs]
symbol = ''
format = '[ $symbol( $version)]($style)'
style = 'bg:deep fg:green'

[python]
symbol = ''
format = '[ $symbol( $version)( \($virtualenv\))]($style)'
style = 'bg:deep fg:yellow'

[rust]
symbol = ''
format = '[ $symbol( $version)]($style)'
style = 'bg:deep fg:orange'

[typst]
symbol = 't'
format = '[ $symbol( $version)]($style)'
style = 'bg:deep fg:cyan'

[palettes.one_half_dark]
# The status line's muted colours on Windows Terminal's One Half Dark. A
# coloured band has a contrast of 2.0 against the background and a text of
# its own hue at 4.6 against the band; the texts on the dark bands reach 4.6
# against `surface`. The prompt character keeps One Half Dark's vivid green
# and red, the red a shade lighter to reach 4.6: it alone has to catch the
# eye, and the two differ in lightness too. Swap this block to move the prompt
# to another colour scheme.
red_band = '#764F54'
red_band_text = '#EBCACF'
blue_band = '#485C6D'
blue_band_text = '#C1D5E7'
surface = '#3E4451'
deep = '#353A45'
subtext = '#AFB3BB'
red = '#D5A7AB'
orange = '#C9AE93'
yellow = '#D7C198'
green = '#A1BA8E'
cyan = '#8CBBC1'
blue = '#8FB7D7'
purple = '#C9A7D3'
success = '#98C379'
error = '#E1737B'
