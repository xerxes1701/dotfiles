# set -g status-justify left
# set -g status-left-length 200
# set -g status-right-length 200
# set -g status-position top
set -g status-style fg=default,bg=default
set -g status-bg default

# enable mouse and turn off bell sound (esp. on click)
set -g mouse on
set -g bell-action none


# enable image preview (in yazi)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


# replace default CRTL-b binding with CRTL-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key -r i run-shell "tmux neww ~/dotfiles/cht.sh"

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# automatic config reload on save
set -g @plugin 'b0o/tmux-autoreload'

# fuzzy find and execute tmux commands via fzf interface
set -g @plugin 'sainnhe/tmux-fzf'

# seamless navigation between tmux and vim
set -g @plugin 'christoomey/vim-tmux-navigator'
source ~/.config/tmux/vim-tmux-navigation.conf

# sensible standard options for tmux
set -g @plugin 'tmux-plugins/tmux-sensible'

# set -g @plugin 'catppuccin/tmux#latest' 
# set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato or mocha

set -g @plugin 'noscript/tmux-mighty-scroll'
  
# automatic naming of tmux windows with nerd font icons
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# better copy and paste
set -g @plugin 'brennanfee/tmux-paste'
set -g @plugin 'tmux-plugins/tmux-yank'

# session manager
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux status line
set -g @plugin 'erikw/tmux-powerline'

# open via in existing neovim pane (via 'ton' script)
set -g @plugin 'trevarj/tmux-open-nvim'

# easy motion like file selection
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key G
# Overrides matching file paths with :[line]:[col] at the end
set -g @fingers-pattern-0 "(([.\\w\\-~\\$@]+)(\\/?[\\w\\-@]+)+\\/?)\\.([\\w]+)(:\\d*:\\d*)?"
# Launche  helper script on Ctrl+[key] in fingers mode
set -g @fingers-ctrl-action "xargs -I {} tmux run-shell 'cd #{pane_current_path}; ~/.config/tmux/plugins/tmux-open-nvim/scripts/ton {} > ~/.config/tmux/plugins/tmux-open-nvim/ton.log'"s


# init tmux plugin manager; keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
