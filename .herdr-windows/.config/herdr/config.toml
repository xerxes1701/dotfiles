# herdr on a windows machine, stowed by stow-deploy-windows.sh in place of
# herdr/ -- see the README, section "windows". Same look and same keys as that
# file; what differs is what herdr on Windows cannot run: the pane shell is
# pwsh instead of fish, and the custom commands call the .ps1 twins of the
# scripts through pwsh instead of the bash scripts by bare name. nav-parity.sh
# checks that the keys block agrees with herdr/ apart from those command lines.
onboarding = false
[ui]
host_cursor = "native"

agent_panel_sort = "spaces"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[theme]
# Explicit, even though it is the default: the devcontainer config
# (../../../.herdr-devcontainer/.config/herdr/config.toml) deliberately runs a
# different theme, and the two are only comparable if both name their own.
name = "catppuccin"

[theme.custom]
# The grey this machine already shows, pinned rather than inherited. These are
# catppuccin mocha's own base (#1e1e2e) and mantle (#181825) -- the same values
# wezterm paints as its background here -- so nothing changes visually; the
# point is that the devcontainer's warm tint is now a diff against a stated
# colour instead of against a default.
panel_bg = "#1e1e2e"
sidebar_bg = "#181825"

[terminal]
# Executable used for new interactive panes (tabs, workspaces, splits). herdr/
# names fish, which this machine does not have; left empty, herdr falls back
# to "PowerShell" and its binary knows both powershell.exe and pwsh.exe, so
# this says which. A bare name: pwsh resolves through PATH, where the
# installer puts it, and the path would change with the major version.
default_shell = "pwsh"

# --- unified navigation scheme ---------------------------------------------
# The prefix picks the level, the letter picks the action. No prefix reaches
# the pane grid (layer 0), the prefix reaches panes and tabs (layer 1), the
# prefix with shift reaches workspaces (layer 2), and inside nvim <Space>
# reaches the same actions one level in. The letter after the prefix here is
# the letter after C-a in tmux and after <Space>s or <Space>t in nvim.
# See ~/dotfiles/README.md, section "navigation".
[keys]
# One prefix for both multiplexers. tmux and herdr are alternatives on this
# machine, never nested, so they can share it -- and ctrl+a is the one nvim
# has already given up (increment lives on <leader>+), which leaves ctrl+b
# free for nvim's page-up instead of being swallowed here.
prefix = "ctrl+a"

# Layer 0 is ctrl+hjkl and ctrl+arrows, in [[keys.command]] below. The prefixed
# focus keys are cleared so that prefix+j and prefix+k can address workspaces,
# the way they do in tmux.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
last_pane = "prefix+backslash"

# layer 1: panes. v puts the new pane to the right and minus puts it below,
# which is what :vsplit and :split do in nvim and what C-a v and C-a - do in
# tmux (spelled there with tmux's own inverted -h and -v flags).
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
# Both closing keys sit one modifier out from their plain letter: bare x next
# to z turned a slipped zoom into a closed pane, so shift+x closes the inner
# thing and ctrl+x the outer one. tmux spells the pair X and C-x.
close_pane = "prefix+shift+x"
zoom = "prefix+z"
cycle_pane_next = "prefix+o"
cycle_pane_previous = "prefix+shift+o"
rename_pane = "prefix+shift+p"
resize_mode = "prefix+r"

# layer 1: tabs. n and p are canonical, because tmux, herdr and nvim
# (<leader>tn, <leader>tp) all had them already; prefix+tab and
# prefix+shift+tab come from herdr-cycle-tab.sh below.
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
close_tab = "prefix+ctrl+x"
rename_tab = "prefix+comma"
switch_tab = "prefix+1..9"

# layer 2: workspaces, which are what tmux calls sessions. Shift on the letter
# moves one level out. j and k rather than another picker key because the
# sidebar lists workspaces vertically and reads the same way: j is the next
# one down, k the previous one up.
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
detach = "prefix+shift+q"

# Moving between workspaces is frequent enough to want it off the prefix, so it
# is alt with the same j and k. C-a j and C-a k still work, through
# herdr-cycle-workspace.sh below: one key per action here, and that is the form
# tmux has too (switch-client -n / -p), so the prefix ladder stays complete.
#
# alt+letter arrives as ESC plus the letter on every terminal, so it needs no
# keyboard protocol and cannot collapse onto ctrl+j, which is pane focus.
next_workspace = "alt+j"
previous_workspace = "alt+k"

# layer 3, and herdr's alone: the agent panel. Neither tmux nor nvim has
# anything to match it, so these are the one part of the scheme with no twin
# elsewhere -- which is also why they can afford the deepest chord. Same j and
# k down the same vertical sidebar, one modifier family further out.
next_agent = "alt+shift+j"
previous_agent = "alt+shift+k"

# unchanged, and already the same key as tmux's and nvim's
help = "prefix+?"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
goto = "prefix+g"
settings = "prefix+s"
edit_scrollback = "prefix+e"

# Layer 0, navigation. The linux configs name smart-splits.nvim's bundled herdr
# plugin here, which forwards the key when the focused pane holds an editor and
# moves herdr focus otherwise -- the same decision tmux makes through
# @pane-is-vim. The plugin cannot serve this side: its manifest says
# platforms = ["linux", "macos"], and its four actions run
# `bash scripts/herdr-navigate.sh` with jq. herdr-navigate.ps1 makes the same
# decision natively; the keys and what they do are unchanged, which is the
# whole of what nav-parity.sh compares.
#
# On Windows herdr runs a command through `cmd.exe /d /c`, which can run
# neither the bash scripts nor a .ps1 on its own, so each command is pwsh with
# the .ps1 twin of the script (same name, same arguments, in the scripts
# package next to the .sh). Full path rather than bare name: nothing puts
# ~/.local/bin on the Windows PATH, and cmd expands %USERPROFILE% before pwsh
# sees it. -NoProfile keeps the startup cost to pwsh itself; -ExecutionPolicy
# Bypass because a deployed file is a symlink or sits in a junctioned
# directory, and the policy of a machine set to RemoteSigned is not worth
# depending on for a keybinding.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-navigate.ps1" left'
description = "goto left pane/split"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-navigate.ps1" down'
description = "goto lower pane/split"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-navigate.ps1" up'
description = "goto upper pane/split"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-navigate.ps1" right'
description = "goto right pane/split"

# Layer 0, resizing. The plugin ships no resize actions, and herdr's own
# resize_pane_* would take the keys before an nvim pane could resize its own
# splits, so this makes the same nvim-or-not decision first, in the twin next
# to the one above.
[[keys.command]]
key = "ctrl+left"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-resize-pane.ps1" left'
description = "resize pane/split left"

[[keys.command]]
key = "ctrl+down"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-resize-pane.ps1" down'
description = "resize pane/split down"

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-resize-pane.ps1" up'
description = "resize pane/split up"

[[keys.command]]
key = "ctrl+right"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-resize-pane.ps1" right'
description = "resize pane/split right"

# Tab means tab at every level: <leader><Tab> in nvim, C-a Tab in tmux.
[[keys.command]]
key = "prefix+tab"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-cycle-tab.ps1" next'
description = "tab move next"

[[keys.command]]
key = "prefix+shift+tab"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-cycle-tab.ps1" prev'
description = "tab move prev"

# The prefix form of the workspace level, kept alongside alt+j/k so that
# C-a j and C-a k mean the same thing here as in tmux.
[[keys.command]]
key = "prefix+j"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-cycle-workspace.ps1" next'
description = "workspace move next"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%USERPROFILE%\.local\bin\herdr-cycle-workspace.ps1" prev'
description = "workspace move prev"

# The shell's beginning-of-line is not lost to the prefix: herdr sends a
# literal prefix key when it is pressed twice, so C-a C-a is a literal C-a.
# tmux does the same through `bind-key C-a send-prefix` in tmux.conf.
