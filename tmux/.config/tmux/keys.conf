# Layers 1 and 2 of the unified navigation scheme, plus the two layer-0
# bindings that have to beat the smart-splits.nvim plugin's own.
#
# The scheme, in one line: the prefix picks the level, the letter picks the
# action. No prefix reaches the pane grid (layer 0, navigation.conf), C-a
# reaches tmux's panes and windows (layer 1), C-a with shift reaches sessions
# (layer 2), and inside nvim <Space> reaches the same actions one level in.
# The letter after C-a here is the letter after <Space>s or <Space>t in nvim
# and the letter after the prefix in herdr. See ~/dotfiles/README.md.
#
# Sourced after `run tpm`, because tpm's plugins install bindings of their own
# and the last binding wins. The prefix itself is set in tmux.conf.

# --- layer 0: the two keys navigation.conf cannot leave to the plugin -------
# Rationale and the edge/no-wrap behaviour are in pane-owns-key.sh.
bind-key -n 'C-j' if -F '#{@pane-is-vim}' 'send-keys C-j' \
    "run-shell -b \"~/.config/tmux/pane-owns-key.sh '#{pane_tty}' '#{pane_id}' C-j D\""
bind-key -n 'C-k' if -F '#{@pane-is-vim}' 'send-keys C-k' \
    "run-shell -b \"~/.config/tmux/pane-owns-key.sh '#{pane_tty}' '#{pane_id}' C-k U\""

# Previous pane. Level-local in every app, exactly as before: inside nvim
# <C-\> is <C-w>p, outside it is tmux's last-pane.
bind-key -n 'C-\' if -F '#{@pane-is-vim}' 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-\' select-pane -l
# Also on the prefix, because that is the only level herdr can put it on: a
# root-level ctrl+backslash there would reach herdr even from an nvim pane,
# and move the wrong level's panes. C-a \ means the same thing in both.
bind-key '\' select-pane -l

# --- layer 1: panes --------------------------------------------------------
# v and - rather than % and ": tmux's own -h and -v flags mean the opposite of
# what :vsplit and :split mean in nvim and of what split_vertical and
# split_horizontal mean in herdr, so the flags are spelled out here and the
# keys follow nvim. v puts the new pane to the right, - puts it below.
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key x kill-pane
bind-key z resize-pane -Z
bind-key e select-layout -E
bind-key o select-pane -t :.+
bind-key O select-pane -t :.-

# --- layer 1: windows, which are what nvim calls tabs and herdr calls tabs --
# Tab means tab at every level: <Space><Tab> in nvim, C-a <Tab> here and in
# herdr. n and p stay as aliases because tmux and herdr both had them already.
bind-key Tab  next-window
bind-key BTab previous-window
bind-key c new-window -c "#{pane_current_path}"
bind-key X kill-window
# x closes the inner thing, X the outer one, matching herdr's defaults.

# --- layer 2: sessions, which are what herdr calls workspaces --------------
# Shift on the letter moves one level out. j and k rather than a picker key
# because herdr lists its workspaces in a vertical sidebar and reads the same
# way: j is the next one down, k the previous one up.
bind-key w choose-tree -Zs
bind-key j switch-client -n
bind-key k switch-client -p
bind-key N new-session
bind-key W command-prompt -I "#S" "rename-session -- '%%'"
bind-key D confirm-before -p "kill session #S? (y/n)" kill-session
bind-key Q detach-client
