# Config of the self-hosted Atuin AI server (github.com/atuinsh/atuin-ai-server)
# that `atuin-ai-server.sh start` runs in rootless podman. It forwards Atuin
# AI's requests to Anthropic's OpenAI-compatible chat-completions endpoint.
# The atuin client finds it through [ai] endpoint in config.toml next to this.
#
# No secret in here: the API key is read from a file the start script puts in
# $XDG_RUNTIME_DIR (tmpfs, only this user, gone at reboot) and mounts
# read-only into the container -- not an environment variable, so it is not
# in `podman inspect` either.

port = 8080
endpoint = "https://api.anthropic.com/v1"

[api_key]
cmd = { run = "cat", args = ["/run/secrets/anthropic-api-key"] }

# Token usage on streamed responses, as the example config ships it.
[request.body]
stream_options = { include_usage = true }

# Switched in the Atuin AI prompt with /model; the choice is remembered.
default_model = "opus"

[[models]]
alias = "opus"
name = "Claude Opus 5.5"
description = "most capable"
model = "claude-opus-5-5"

[[models]]
alias = "sonnet"
name = "Claude Sonnet 5.5"
description = "faster, cheaper"
model = "claude-sonnet-5-5"

[[models]]
alias = "haiku"
name = "Claude Haiku 5.5"
description = "fastest, cheapest"
model = "claude-haiku-5-5"
