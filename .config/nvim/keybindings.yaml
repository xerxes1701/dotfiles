  - { key: "s =l",         mode: "n",     action: "goto_next_start @assignment.lhs",  description: "Hydra: next assignment LHS",              file: "lua/plugins/hydra.lua", plugin: "hydra.nvim", group: "Treewalker Hydra", source: "explicit" }
