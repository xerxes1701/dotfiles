# Layer 0 of the unified navigation scheme: no prefix, level-transparent.
# nvim splits and tmux panes are one grid, and C-hjkl / C-arrows cross the
# boundary between them. See ~/dotfiles/README.md, section "navigation".
#
# Only options here. The bindings themselves are installed by the
# smart-splits.nvim tmux plugin when tpm runs it, which is why this file is
# sourced before `run tpm` and keys.conf after it.
#
# smart-splits.nvim replaced christoomey/vim-tmux-navigator. The difference
# that matters: the old plugin guessed whether a pane held nvim by matching
# `ps` output against a regex, this one branches on the pane-local option
# @pane-is-vim, which nvim sets on load and clears on exit. That is why
# smart-splits.nvim must not be lazy-loaded in nvim -- see
# nvim/.config/nvim/lua/plugins/smart-splits.lua.
set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'
set -g @smart-splits_move_right_key 'C-l'

# Resize on C-arrows rather than the plugin's M-hjkl default. M-l and M-h are
# Copilot's accept-suggestion and previous-suggestion keys in nvim insert
# mode; tmux would forward them to a nvim pane, but not to anything else.
set -g @smart-splits_resize_left_key  'C-Left'
set -g @smart-splits_resize_down_key  'C-Down'
set -g @smart-splits_resize_up_key    'C-Up'
set -g @smart-splits_resize_right_key 'C-Right'
set -g @smart-splits_resize_step_size '3'

# No wrapping at the outer edge. This is what vim-tmux-navigator did, it
# matches at_edge = "stop" in the nvim spec, and herdr-navigate.sh does not
# wrap either. Without it the edge would behave differently depending on which
# app owns the pane you are leaving.
set -g @smart-splits_no_wrap 'yes'

# One checkout, three consumers. Installing this through tpm would clone a
# second copy of the repository at master HEAD, while nvim's copy is pinned in
# lazy-lock.json and herdr's plugin is linked against that same copy -- three
# sides of one protocol, two of them pinned and one of them not. Sourcing
# nvim's checkout instead keeps all three on the commit named in the nvim spec.
# Guarded, because the checkout does not exist until nvim has installed it.
if-shell '[ -f ~/.local/share/nvim/lazy/smart-splits.nvim/smart-splits.tmux ]' \
    'run-shell ~/.local/share/nvim/lazy/smart-splits.nvim/smart-splits.tmux'
