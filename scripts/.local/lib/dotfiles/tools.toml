# --- what the shells, git and neovim call -------------------------------------

# debian and ubuntu ship the binary as batcat. The shells alias it, but an
# alias does not reach fzf's previews or nvim, so it is linked under its own
# name -- only where bat is missing and batcat is there.
[bat]
desc = "cat with syntax highlighting"
os = ["linux", "windows"]
pacman = "bat"
apt = "bat"
winget = "sharkdp.bat"
setup_check = "! link_needed bat batcat"
setup = "link_apply bat batcat"

