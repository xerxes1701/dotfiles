# The tools this repository has a package for, and how to install each one.
# Read by install-tools.sh.
#
# Format: one tool per line, whitespace-separated columns, the description
# taking the rest of the line:
#
#   <label> <os> <pacman> <apt> <winget> <description...>
#
#   label   the stow package the tool's config lives in, or for a tool a
#           package needs rather than configures, the tool's own name
#   os      linux, windows, or linux,windows: where it should be installed
#   pacman  cachyos/arch package names; aur:<name> goes through paru
#   apt     ubuntu/debian package names
#   winget  winget package ids, installed with --exact
#
# Several packages go comma-separated into one column, and - means there is
# no package for that manager: the tool is then listed as one to install by
# hand, see the README.
#
# The herdr plugins (herdr/plugins) need tools of their own, listed under
# their own names: herdr-load is built with dotnet and clang, and
# herdr-machines drives docker and the devcontainer CLI from an fzf picker,
# with jq and python3. Native AOT also links against zlib, which arch has in
# its base and ubuntu needs zlib1g-dev for; windows builds herdr-load-win
# with Visual Studio's C++ build tools, which winget cannot pick a workload
# for, so clang is linux only.
#
# git pages and filters its diffs through delta, which the fzf previews of
# its aliases use too.
#
# The shells and neovim lean on tools of their own too, listed the same way.
# The shells alias ls and tree to eza, jump with zoxide, and have fzf list
# with fd and preview with bat. Neovim's treesitter builds its parsers with
# the tree-sitter CLI and a C compiler (clang here, zig on windows), telescope
# searches with ripgrep and fd, difft.nvim diffs with difftastic, mason
# unpacks with unzip and installs the js tools through npm, markdown-preview
# builds with corepack, which node stopped shipping with v25, roslyn and
# easy-dotnet run on dotnet, and rustaceanvim wants cargo. rust is rustup,
# which installs no toolchain itself: run `rustup default stable` once.
# ubuntu calls fd's binary fdfind and bat's batcat; the shells call fd and
# bat, so link them under those names in ~/.local/bin.
#
# Not every package is a tool: gtk-3.0, images and xkb are plain config,
# tmux-powerline is a tmux plugin that tpm installs, and scoop installs itself
# from a script, so none of them is listed.
#
# ubuntu's archive was checked for 24.04 (noble): fastfetch and starship arrive
# in 25.04, ghostty in 26.04, and install-tools.sh skips a package the
# machine's release does not have.

# label      os            pacman                apt                         winget                  description
bash         linux         bash                  bash                        -                       bash shell
bat          linux,windows bat                   bat                         sharkdp.bat             cat with syntax highlighting
clang        linux         clang                 clang,zlib1g-dev            -                       c compiler: herdr-load, and nvim's treesitter parsers
claude       linux,windows claude-code           -                           Anthropic.ClaudeCode    claude code cli
devcontainer linux         aur:devcontainer-cli  -                           -                       devcontainer cli, for herdr-machines
delta        linux,windows git-delta             git-delta                   dandavison.delta        git's pager and diff filter, and the git aliases' previews
difftastic   linux,windows difftastic            -                           Wilfred.difftastic      structural diff, for nvim's difft
docker       linux         docker,docker-compose docker.io,docker-compose-v2 -                       containers, for herdr-machines
dotnet       linux,windows dotnet-sdk-10.0       dotnet-sdk-10.0             Microsoft.DotNet.SDK.10 .NET 10 sdk: herdr-load, and nvim's roslyn and easy-dotnet
eza          linux,windows eza                   eza                         eza-community.eza       ls and tree, as the shells alias them
fastfetch    linux,windows fastfetch             fastfetch                   Fastfetch-cli.Fastfetch system info at a glance
fd           linux,windows fd                    fd-find                     sharkdp.fd              find, for fzf in the shells and telescope
fish         linux         fish                  fish                        -                       fish shell
fzf          linux,windows fzf                   fzf                         junegunn.fzf            fuzzy finder: the shells, herdr-machines
ghostty      linux         ghostty               ghostty                     -                       terminal emulator
git          linux,windows git                   git                         Git.Git                 version control, and git bash on windows
herdr        linux,windows aur:herdr-bin         -                           Herdr.Herdr             terminal workspace and agent multiplexer
jq           linux,windows jq                    jq                          jqlang.jq               json processor, for herdr-machines
kmonad       linux,windows kmonad                -                           -                       keyboard remapping, the home-row mods
komorebi     windows       -                     -                           LGUG2Z.komorebi         tiling window manager
niri         linux         niri                  -                           -                       scrollable tiling wayland compositor
node         linux,windows nodejs,npm,corepack   nodejs,npm                  OpenJS.NodeJS.LTS       claude's statusline.mjs, mason's js tools, markdown-preview
nushell      linux,windows nushell               -                           Nushell.Nushell         structured shell
nvim         linux,windows neovim                neovim                      Neovim.Neovim           editor
powershell   windows       -                     -                           Microsoft.PowerShell    powershell 7
python       linux         python                python3                     -                       python 3, for herdr-machines
ripgrep      linux,windows ripgrep               ripgrep                     BurntSushi.ripgrep.MSVC grep, for telescope and the powershell finders
rust         linux,windows rustup                rustup                      Rustlang.Rustup         rust toolchain manager: cargo, for rustaceanvim
ssh          linux         openssh               openssh-client              -                       ssh client and agent
starship     linux,windows starship              starship                    Starship.Starship       shell prompt
stow         linux         stow                  stow                        -                       deploys this repository's packages
tmux         linux         tmux                  tmux                        -                       terminal multiplexer
tmuxinator   linux         aur:tmuxinator        tmuxinator                  -                       tmux session layouts
tree-sitter  linux,windows tree-sitter-cli       -                           -                       builds nvim's treesitter parsers
unzip        linux         unzip                 unzip                       -                       mason unpacks its tools with it
vale         linux,windows vale                  -                           errata-ai.Vale          prose linter
wezterm      linux,windows wezterm               -                           wez.wezterm             terminal emulator
whkd         windows       -                     -                           LGUG2Z.whkd             hotkey daemon for komorebi
wl-clipboard linux         wl-clipboard          wl-clipboard                -                       wayland clipboard, for nvim and the shells
wl-clip-persist linux      wl-clip-persist       -                           -                       keeps the clipboard after the app copied from closes, for niri
yazi         linux,windows yazi                  -                           sxyazi.yazi             terminal file manager
zellij       linux         zellij                -                           -                       terminal multiplexer
zig          windows       -                     -                           zig.zig                 c compiler for nvim's treesitter on windows
zoxide       linux,windows zoxide                zoxide                      ajeetdsouza.zoxide      cd that learns, for every shell
zsh          linux         zsh                   zsh                         -                       z shell
