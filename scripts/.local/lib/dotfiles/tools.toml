# Mike Farah's go yq; ubuntu's yq package is the python wrapper around jq.
[yq]
desc = "yaml processor, for nvim's keybinding inventory"
os = ["linux", "windows"]
pacman = "go-yq"
winget = "MikeFarah.yq"
script.debian = '''
case $(uname -m) in
    x86_64)  arch=amd64 ;;
    aarch64) arch=arm64 ;;
    *)       echo "no yq build for $(uname -m)" >&2; exit 1 ;;
esac
mkdir -p ~/.local/bin
curl -fsSLo ~/.local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_$arch"
chmod +x ~/.local/bin/yq
'''
needs.debian = ["curl"]
check = "yq --version 2>&1 | grep -q mikefarah"

